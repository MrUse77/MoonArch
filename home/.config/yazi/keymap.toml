[[mgr.prepend_keymap]]
on  = "y"
run = [ 'shell -- for path in %s; do echo "file://$path"; done | wl-copy -t text/uri-list', "yank" ]
[[mgr.prepend_keymap]]
on   = [ "<C-d>" ]
run  = [ 'shell -- for path in %s; do echo "file://$path"; done | wl-copy -t text/uri-list', "yank" ]
desc = "Drag files (copies their URIs to the clipboard)"
